# Served behind Coolify's Traefik proxy. Traefik terminates TLS and forwards
# X-Forwarded-Proto, so no TLS/redirect configuration is needed here.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Coolify healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Media: cache, keeping the nginx MIME type from mime.types for .mp4 etc.
    location ~* \.(?:jpg|jpeg|png|webp|gif|ico|svg|mp4|webm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Service worker and manifest must always be revalidated.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Serve the per-route static HTML generated by scripts-seo.mjs when it exists,
    # then the SPA fallback. Directories are tried before the extension-less $uri.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Unknown asset paths return the SPA shell (same behaviour as the previous host).
    error_page 404 /index.html;
}
